name: Frontend CI Pipeline

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

permissions:
  pull-requests: write
  contents: read

jobs:
  build-and-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install Dependencies
        run: |
          npm install --legacy-peer-deps

      - name: Run Next.js Linter
        run: |
          npm run lint

      - name: Compile and Build Next.js App
        run: |
          npm run build

  create-pull-request:
    needs: build-and-lint
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/dev'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create or Update Pull Request
        run: |
          # Use GitHub CLI to check if PR already exists, and create it if not
          PR_EXISTS=$(gh pr list --base main --head dev --json number --jq '.[0].number')
          if [ -z "$PR_EXISTS" ]; then
            echo "Creating a new Pull Request..."
            gh pr create --title "CI Passed: Merge dev into main" --body "Automated Pull Request generated by GitHub Actions after successful CI run on the dev branch." --base main --head dev
          else
            echo "Pull Request already exists: PR #$PR_EXISTS"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

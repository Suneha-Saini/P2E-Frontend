name: Frontend CI/CD Pipeline

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

permissions:
  pull-requests: write
  contents: write

jobs:
  build-and-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install Dependencies
        run: |
          npm install --legacy-peer-deps

      - name: Run Next.js Linter
        run: |
          npm run lint

      - name: Compile and Build Next.js App
        run: |
          npm run build

  auto-merge-to-main:
    needs: build-and-lint
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/dev'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create and Automatically Merge Pull Request
        run: |
          PR_NUMBER=$(gh pr list --base main --head dev --json number --jq '.[0].number')
          
          if [ -z "$PR_NUMBER" ]; then
            echo "Creating a new Pull Request..."
            PR_URL=$(gh pr create --title "CI Passed: Auto-Merge dev into main" --body "Automated Pull Request generated by GitHub Actions after successful CI run on the dev branch." --base main --head dev)
            PR_NUMBER=$(echo "$PR_URL" | grep -oE "[0-9]+$")
          else
            echo "Pull Request already exists: PR #$PR_NUMBER"
          fi
          
          echo "Automatically merging Pull Request #$PR_NUMBER into main..."
          gh pr merge "$PR_NUMBER" --merge --admin || gh pr merge "$PR_NUMBER" --merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-to-vercel:
    needs: build-and-lint
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install --global vercel

      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build Project Artifacts
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy to Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
